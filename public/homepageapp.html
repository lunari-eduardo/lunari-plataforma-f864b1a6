<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunari — Sistema de Gestão para Fotógrafos</title>
  <meta name="description" content="Lunari é um sistema de gestão para fotógrafos e estúdios fotográficos com agenda, CRM, financeiro, workflow e integração com Google Calendar.">
  <link rel="canonical" href="https://lunarihub.com/homepageapp">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --bg-color: #0F1115;
      --card-bg: #181B22;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --accent-gold: #C9A87C;
      --border-color: #262A35;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }
    main {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      max-width: 640px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1.25rem;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    nav {
      display: flex;
      gap: 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }
    nav a {
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }
    nav a:hover {
      text-decoration: underline;
      opacity: 0.9;
    }
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Lunari</h1>
    <p>Lunari é um sistema de gestão para fotógrafos e estúdios fotográficos com agenda, CRM, financeiro, workflow e integração com Google Calendar.</p>
    <nav>
      <a href="https://lunarihub.com/legal/privacidade" title="Política de Privacidade da Lunari">Política de Privacidade</a>
      <a href="https://lunarihub.com/legal/termos" title="Termos de Uso da Lunari">Termos de Uso</a>
    </nav>
  </main>
  <footer>
    &copy; Lunari — Todos os direitos reservados.
  </footer>
</body>
</html>
